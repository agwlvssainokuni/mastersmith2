# コミットの直前に、秘密情報の検出とフォーマットの確認を自動で行う（各自が一度 pre-commit install を実行する）。
# pre-push のフックは置かない（統合の前に ./gradlew verify を手で実行する）。
# 道具の版はここで固定し、更新は手で行う（pre-commit autoupdate の結果を確かめてからコミットする）。
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: spotless-check
        name: Spotless のフォーマットとライセンスヘッダーの確認（Java・Gradle の Kotlin DSL）
        entry: ./gradlew --quiet spotlessCheck :backend:spotlessCheck
        language: system
        files: \.(java|kts)$
        pass_filenames: false
      - id: prettier-check
        name: Prettier のフォーマットの確認（画面）
        entry: bash -c 'cd frontend && npx --no-install prettier --check --ignore-unknown "${@#frontend/}"' --
        language: system
        files: ^frontend/
        exclude: ^frontend/package-lock\.json$
