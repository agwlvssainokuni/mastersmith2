# 負荷の試験（Performance Validation）のための使い捨ての環境。配備した環境（compose.yaml）とは別のプロジェクト名・別のボリュームで動かす。
#   起動: docker compose -p mastersmith-perf -f docker/perf/compose.yaml up -d --wait
#   消す: docker compose -p mastersmith-perf -f docker/perf/compose.yaml down -v
# 仮の署名鍵・仮の管理者は、リポジトリの外に作る一時の環境ファイル（MASTERSMITH_PERF_ENV_FILE で場所を渡す）から読む。
# イメージは配備と同じ mastersmith:local を使う（事前に docker compose build で作っておく）。手順は perf/README.md。
name: mastersmith-perf

services:
  app:
    image: mastersmith:${MASTERSMITH_IMAGE_TAG:-local}
    ports:
      - "127.0.0.1:18080:8080"
    env_file:
      - path: ${MASTERSMITH_PERF_ENV_FILE:?一時の環境ファイルの場所を MASTERSMITH_PERF_ENV_FILE で渡してください}
        required: true
    environment:
      TZ: Asia/Tokyo
    volumes:
      - perf-data:/app/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 2s
    stop_grace_period: 45s
    # 配備と同じ上限（Performance Validation の Q3: この PC の実態の CPU 2 で測る）。
    cpus: ${MASTERSMITH_CONTAINER_CPUS:-4}
    mem_limit: 1g
    restart: "no"

volumes:
  perf-data:
