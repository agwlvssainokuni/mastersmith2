# 手元の監視（compose の profile monitoring）の Grafana に、MasterSmith のダッシュボードを読み込ませる。
apiVersion: 1

providers:
  - name: "MasterSmith"
    folder: "MasterSmith"
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /otel-lgtm/mastersmith-dashboards
      foldersFromFilesStructure: false
