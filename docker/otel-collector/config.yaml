# 外部エクスポートを手元で確かめるための OTLP の受け手の設定（compose の profile observability のときだけ起動する）。
# 受け取ったトレース・ログ・指標を標準出力に出すだけで、外へは送らない。
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
