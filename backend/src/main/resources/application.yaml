# アプリの設定。秘密情報の値はここに書かず、環境変数の参照だけを置く。
# 環境変数の一覧は README.md と .env.example を参照。

mastersmith:
  web:
    # エラー応答の type の URL の元になるベースURL（例: https://example.com）。無ければ要求から組み立てる。
    base-url: ${MASTERSMITH_WEB_BASE_URL:}
    # 転送元のヘッダー（X-Forwarded-*・Forwarded）を信頼するか。プロキシの内側からだけ受け付ける配備でだけ true にする。
    trust-forwarded-headers: ${MASTERSMITH_WEB_TRUST_FORWARDED_HEADERS:false}
    # 要求の本文の大きさの上限
    max-request-body-size: ${MASTERSMITH_WEB_MAX_REQUEST_BODY_SIZE:1MB}
  health:
    # ヘルスチェックの内部DBの確認の制限時間
    db-timeout: ${MASTERSMITH_HEALTH_DB_TIMEOUT:2s}
  observability:
    export:
      # 外部エクスポート（トレース・ログ・指標の OTLP の送信）をまとめて有効にするか。既定は無効。
      enabled: ${MASTERSMITH_OBSERVABILITY_EXPORT_ENABLED:false}
      # OTLP の受け手（HTTP）のベースURL。信号ごとの上書きは management.* の設定で行う。
      endpoint: ${MASTERSMITH_OBSERVABILITY_EXPORT_ENDPOINT:http://localhost:4318}
  trace:
    # メソッドの呼び出しの追跡（TraceAspect）。対象のクラスのロガーを TRACE にしたときだけ出る。
    # 値は Spring の CustomizableTraceInterceptor の同じ名前の設定に渡す。
    # 対象のクラスの名前のロガーを使うか
    use-dynamic-logger: ${MASTERSMITH_TRACE_USE_DYNAMIC_LOGGER:true}
    # 代理のクラス（プロキシ）の名前を隠すか
    hide-proxy-class-names: ${MASTERSMITH_TRACE_HIDE_PROXY_CLASS_NAMES:true}
    # 例外のときにスタックトレースを出すか
    log-exception-stack-trace: ${MASTERSMITH_TRACE_LOG_EXCEPTION_STACK_TRACE:true}
    # 入る・出る・例外の文言（EXIT の後の空白2つは意図したもの）
    enter-message: "${MASTERSMITH_TRACE_ENTER_MESSAGE:ENTER $[targetClassShortName]#$[methodName]($[arguments])}"
    exit-message: "${MASTERSMITH_TRACE_EXIT_MESSAGE:EXIT  $[targetClassShortName]#$[methodName](): $[returnValue]}"
    exception-message: "${MASTERSMITH_TRACE_EXCEPTION_MESSAGE:EXCEPTION $[targetClassShortName]#$[methodName](): $[exception]}"
  auth:
    # 認証（U2）。既定値は Java の設定の型（AuthProperties・PasswordProperties）の既定値と同じにする。
    # アクセストークンの署名鍵（必須・秘密）。32 バイト以上の乱数を Base64 にした値（例: openssl rand -base64 32）。
    # 値はここに書かず、環境変数で渡す。無い・短いと起動を止める。
    signing-key: ${MASTERSMITH_AUTH_SIGNING_KEY:}
    # アクセストークンの有効期限
    access-token-ttl: ${MASTERSMITH_AUTH_ACCESS_TOKEN_TTL:5m}
    # リフレッシュトークンの有効期限（Cookie の寿命も同じ）
    refresh-token-ttl: ${MASTERSMITH_AUTH_REFRESH_TOKEN_TTL:24h}
    lock:
      # ロックするまでの連続失敗回数（1 以上）
      threshold: ${MASTERSMITH_AUTH_LOCK_THRESHOLD:5}
      # ロックの時間（正の値）
      duration: ${MASTERSMITH_AUTH_LOCK_DURATION:30m}
    password:
      # パスワードのハッシュ（bcrypt）の cost（4〜31）
      bcrypt-cost: ${MASTERSMITH_AUTH_PASSWORD_BCRYPT_COST:12}
    initial-admin:
      # 初期管理者のメールアドレスとパスワード（秘密。パスワードは 12 文字以上、UTF-8 で 72 バイト以内）。
      # 値はここに書かず、環境変数で渡す。無い・正しくないときは作らずに警告し、起動は続ける。
      email: ${MASTERSMITH_AUTH_INITIAL_ADMIN_EMAIL:}
      password: ${MASTERSMITH_AUTH_INITIAL_ADMIN_PASSWORD:}
    refresh-token-cleanup:
      # 無効・期限切れのリフレッシュトークンを、期限からどれだけ残してから消すか
      retention: ${MASTERSMITH_AUTH_REFRESH_TOKEN_CLEANUP_RETENTION:7d}
      # 削除を行う時刻（Spring の cron の形。秒 分 時 日 月 曜日。既定は毎日 3 時 30 分）
      cron: "${MASTERSMITH_AUTH_REFRESH_TOKEN_CLEANUP_CRON:0 30 3 * * *}"
  target-db:
    # 対象DB（利用者の業務データの DB。U1）。接続先はこの設定（環境変数）だけから受け取る。
    # 7つの項目がすべて空なら対象DB を使わない（起動は続く）。一部だけが空・不正なら、項目の名前だけを WARN で出して使わない。
    # 値（接続先・ユーザー名・パスワード）はここに書かず、環境変数で渡す。アカウントは読み取りの権限だけにすることを勧める。
    # DB の種類（mysql・mariadb・postgresql。大文字・小文字は問わない）
    type: ${MASTERSMITH_TARGET_DB_TYPE:}
    # 接続先のホスト名と番号（1〜65535）
    host: ${MASTERSMITH_TARGET_DB_HOST:}
    port: ${MASTERSMITH_TARGET_DB_PORT:}
    # 接続する DB の名前
    database: ${MASTERSMITH_TARGET_DB_DATABASE:}
    # 読み取るスキーマの名前（MySQL・MariaDB では DB の名前と同じ）
    schema: ${MASTERSMITH_TARGET_DB_SCHEMA:}
    # 接続のユーザー名とパスワード（秘密）
    username: ${MASTERSMITH_TARGET_DB_USERNAME:}
    password: ${MASTERSMITH_TARGET_DB_PASSWORD:}
    # 接続の待ちの上限（生成・照合とも）
    connect-timeout: ${MASTERSMITH_TARGET_DB_CONNECT_TIMEOUT:3s}
    query-timeout:
      # 問い合わせ1回の待ちの上限（既定の DSL の生成）
      generate: ${MASTERSMITH_TARGET_DB_QUERY_TIMEOUT_GENERATE:20s}
      # 問い合わせ1回の待ちの上限（照合）。読み取りの全体の上限は置かない（決定 B）。応答しない対象DB では、
      # 照合でも最悪 接続の待ち＋この値×4 回（既定で約 23 秒）かかりうる
      compare: ${MASTERSMITH_TARGET_DB_QUERY_TIMEOUT_COMPARE:5s}
    pool:
      # 対象DB の接続の数の上限（内部DB の接続とは別）
      maximum-size: ${MASTERSMITH_TARGET_DB_POOL_MAXIMUM_SIZE:5}
      # 使っていない接続を閉じるまでの時間
      idle-timeout: ${MASTERSMITH_TARGET_DB_POOL_IDLE_TIMEOUT:60s}
  dsl:
    # DSL の管理（U4）。既定値は Java の設定の型（DslManageProperties）の既定値と同じにする。
    # 投入の API（POST /api/admin/dsl/preview）だけの要求の本文の上限（既定 10MB = 10,485,760 バイト）。
    # ほかの API は mastersmith.web.max-request-body-size（既定 1MB）のまま。
    max-submit-size: ${MASTERSMITH_DSL_MAX_SUBMIT_SIZE:10MB}
    # 適用の履歴の件数の上限（既定 20、1 以上）。超えた分は古いものから消す。
    history-limit: ${MASTERSMITH_DSL_HISTORY_LIMIT:20}
  security:
    # 応答に付ける Content-Security-Policy。画面の構成が変わったときに見直す。
    content-security-policy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

spring:
  application:
    name: mastersmith
  autoconfigure:
    # 利用者の仕組みは U2 が用意する。既定の利用者（生成したパスワードをログに出す）は作らない。
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  web:
    resources:
      # 画面の配信は WebConfig で行う（見つからない画面の URL に index.html を返すため）。
      add-mappings: false
  main:
    banner-mode: off
  lifecycle:
    # 穏やかな停止の待ち時間の上限
    timeout-per-shutdown-phase: 30s
  # 内部DB。既定は組み込み・ファイル保存（作業ディレクトリの ./data/、コンテナでは /app/data）。
  # H2 の TCP サーバーや複数のプロセスからの自動の接続（AUTO_SERVER）は使わない。
  # 接続先は環境変数だけで切り替えられる。パスワードは環境変数で渡し、ここには書かない。
  datasource:
    url: ${MASTERSMITH_DB_URL:jdbc:h2:file:./data/mastersmith}
    username: ${MASTERSMITH_DB_USERNAME:sa}
    password: ${MASTERSMITH_DB_PASSWORD:}
    hikari:
      pool-name: mastersmith-db
      # 接続の数の上限。既定は 30 で、環境変数 MASTERSMITH_DB_MAXIMUM_POOL_SIZE で変えられる。
      # ログインなどでは、確定の後の監査の記録が業務の接続（1本目）を持ったまま2本目を借りるため、
      # 同時の要求の数がこの上限に達すると監査の記録が欠けうる（README の「監査ログ（U4）」の既知の制約）。
      maximum-pool-size: ${MASTERSMITH_DB_MAXIMUM_POOL_SIZE:30}
      # 接続を借りる待ちの上限（ミリ秒）
      connection-timeout: 5000
  jpa:
    # 画面の描画まで DB の接続を持ち越さない。
    open-in-view: false
    hibernate:
      # スキーマは Flyway が正本。Hibernate は作らず、検証だけ行う。
      ddl-auto: validate
    properties:
      # 問い合わせの時間の上限（ミリ秒）
      jakarta.persistence.query.timeout: 10000
  flyway:
    # 起動時にスキーマの変更を当てる。失敗したら起動を止める。
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  h2:
    console:
      # H2 のコンソールは開発時も含めて使わない。
      enabled: false

server:
  port: 8080
  shutdown: graceful
  # 転送元のヘッダーは既定で使わない。信頼するときはアプリの設定（mastersmith.web.trust-forwarded-headers）で切り替える。
  forward-headers-strategy: none
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,application/problem+json
  error:
    include-exception: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        # Web に公開するのは health だけ。
        include: health
      # 窓口の一覧のページ（/actuator）も出さない。
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      # 応答は状態だけにする（liveness・readiness のグループ名も出さない）。
      probes:
        enabled: false
  health:
    # 既定の DB の確認は使わず、制限時間付きの確認（TimeBoundedDbHealthIndicator）に置き換える。
    db:
      enabled: false
    diskspace:
      enabled: false
    ssl:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # 外部へ送るトレースの割合。トレースIDは率に関係なくすべての要求に割り当てる。
      probability: ${MASTERSMITH_TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    baggage:
      enabled: false
    export:
      otlp:
        enabled: ${mastersmith.observability.export.enabled}
  logging:
    export:
      otlp:
        enabled: ${mastersmith.observability.export.enabled}
  otlp:
    metrics:
      export:
        enabled: ${mastersmith.observability.export.enabled}
        url: ${mastersmith.observability.export.endpoint}/v1/metrics
        step: 60s
        read-timeout: 10s
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${mastersmith.observability.export.endpoint}/v1/traces
          timeout: 10s
    logging:
      export:
        otlp:
          endpoint: ${mastersmith.observability.export.endpoint}/v1/logs
          timeout: 10s

logging:
  level:
    root: INFO
    # 対象DB（U1）の3つのドライバー（MariaDB・PostgreSQL・MySQL）自身のログは出さない。
    # なぜ: ドライバーのログは接続先・ユーザー名・例外の文言を含むことがあり、ログ・外部へのエクスポートに接続情報を
    #   出さない決まり（NFR4.4）を破るため。MariaDB のドライバーが認証の失敗をユーザー名つきで WARN に出すことを
    #   結合テストで確かめた。MySQL・PostgreSQL のドライバーも接続先などを文言に含めうるため、同じ扱いにそろえる。
    # 障害の調べ方: 読み取りの口（JdbcTargetSchemaReader）が出す WARN の purpose・reason（TIMEOUT・CONNECTION_FAILED）・
    #   sqlState で原因を絞る（08 で始まる: 接続できない、28 で始まる: 認証の失敗、57014: 問い合わせの打ち切り）。
    #   さらに調べるときは、同じネットワークから DB の付属のクライアント（psql・mysql・mariadb）で接続を試すか、
    #   対象DB の側のログを見る。配備した環境でドライバーのログを有効にしない（接続情報がログに残るため）。
    org.mariadb.jdbc: OFF
    org.postgresql: OFF
    com.mysql.cj: OFF
