# Gitleaks の設定。既定の規則をそのまま引き継ぐ。
# 除外を足すときは、理由を書き、秘密情報でないことを確かめたものに限る。
title = "mastersmith"

[extend]
useDefault = true

# 誤検出の除外: AI-DLC の記録（aidlc/ の下の memory.md）に道具が書く目印のコメント
# `<!-- aidlc-wave-memory:<単位>:<SHA-256 の16進数64桁> -->` は内容のハッシュ値であり、秘密情報ではない。
# 対象を「aidlc/ の下の memory.md」かつ「検出された値が <単位>:<64桁の16進数> の形」の両方に当たるものだけに絞る。
[[allowlists]]
description = "AI-DLC の記録の目印のハッシュ値（秘密情報ではない）"
condition = "AND"
regexTarget = "match"
regexes = ['''^[a-z0-9-]+:[0-9a-f]{64}\s*$''']
paths = ['''^aidlc/spaces/[^/]+/intents/.+/memory\.md$''']
