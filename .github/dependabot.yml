# 依存関係の更新の知らせ（Dependabot）。vendor/make-you-chic-ui の更新は make-you-chic-ui のリポジトリ側で行い、
# サブモジュール（vendor/make-you-chic-ui・vendor/java-mustache-processor）の固定先の更新は承認を得た専用のコミットで行う
# （ここでは対象にしない）。
# 知らせのプルリクエストは GitHub の画面でマージしない。手元で版と lockfile をまとめて更新し、./gradlew verify を通してから develop に
# 統合し、プルリクエストは閉じる（team.md の Way of Working）。
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # composite build で組むサブモジュール（vendor/java-mustache-processor）の中のビルドの依存は、このリポジトリからは
    # 更新できない（中身を直接変更しない）。対象に入れると更新できずに Dependabot の実行が失敗になるため外す。
    # サブモジュールの依存の更新は java-mustache-processor のリポジトリ側で行う（Intent 260925-user-management の CI Pipeline の Q1）。
    exclude-paths:
      - "vendor/**"
    # 見送る更新（Intent 260928-quality-followup の FR5.4、F2: C・Q1: A）。
    # opentelemetry-logback-appender は 2.28.1-alpha に固定している（Spring Boot 4.1.1 の OpenTelemetry 1.62 と、より新しい版が
    # 食い違い、外部エクスポートを有効にしたときに失敗するため。project.md の Tech Stack）。外部エクスポートが既定で無効の
    # ./gradlew verify ではこの失敗が現れず確かめられないため、すべての更新を知らせない。
    # 外す時期: Spring Boot を上げるとき（この部品の版も合わせて見直し、外部エクスポートを有効にして確かめる）。
    #
    # networknt-json-schema-validator は 3.0.6 に固定している。3.0.7 以降はアプリ全体の Jackson を 3.2 系に引き上げ、Spring Boot の
    # 管理の 3.1 系から外れるため（project.md の学び、Intent 260928-quality-followup の G4: A）。すべての更新を知らせない。
    # 外す時期: Spring Boot を上げて、Spring Boot の管理の Jackson が 3.2 系以上になったとき。
    #
    # Jackson の BOM（tools.jackson:jackson-bom）は、脆弱性の直しのために Spring Boot の管理の 3.1 系のままパッチの版だけを
    # 上書きしている（Intent 260928-quality-followup の G4: A）。パッチの更新も含め、すべての版の更新を知らせない
    # （Intent 260929-log-deps-cleanup の FR4.4、依頼者の決定）。
    # 知らせを受けない代わりに、脆弱性の直しが要る版には OSV-Scanner の関門（./gradlew verify の osvScan）で気づく。この関門が
    # 働くのは、手元の ./gradlew verify と CI の実行のときだけで、Dependabot のように新しい脆弱性の公表の時点では知らせない。
    # team.md の Way of Working の「重大度 High 以上の知らせは次の Bolt に入る前に取り込む」とは、Jackson については
    # Dependabot の知らせではなく次の verify・CI の OSV-Scanner で気づく形になる点が異なる（要件のレビューの R-02 を受け入れた扱い）。
    # 外す時期: Spring Boot を上げるとき（この上書きの要否を合わせて見直す）。
    ignore:
      - dependency-name: "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0"
      - dependency-name: "com.networknt:json-schema-validator"
      - dependency-name: "tools.jackson:jackson-bom"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # 見送る更新（Intent 260929-log-deps-cleanup の FR4.3）。
    # typescript の大きな版の更新だけを知らせない。@typescript-eslint/* の peer が typescript の >=4.8.4 <6.1.0 で、7 系を
    # 取り込むと型の検査と ESLint が壊れうるため。@typescript-eslint/* 自体の更新は知らせる（ignore に入れない）。
    # 6 系の中の小さな更新は知らせる。
    # 外す時期: @typescript-eslint/* が TypeScript 7 を受け付けたとき。
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # ダイジェストでのイメージの固定（Intent 261004-safety-carryover の FR7.2・FR7.3、依頼者の決定 D4: A）。
  # 次のイメージは「版のタグ@sha256:ダイジェスト」の形で固定している。付けるダイジェストは、複数のアーキテクチャをまとめた
  # index（manifest list。linux/arm64 と linux/amd64 を含む）のもので、1つのアーキテクチャのイメージのダイジェストは使わない
  # （docker buildx imagetools inspect <タグ> の先頭の Digest を読み、Manifests に2つのアーキテクチャがあることを確かめる）。
  #   - Dockerfile の eclipse-temurin:25.0.4_7-jre-noble（この docker の項が見る）
  #   - compose.yaml の otel/opentelemetry-collector・grafana/otel-lgtm（下の docker-compose の項が見る）
  #   - 対象DB（mysql・mariadb・postgres）と Mailpit（前の Intent から固定している。下の docker-compose の項が見る）
  # Dependabot が見ない固定先: docker/perf/compose.yaml、backend/src/test/java/cherry/mastersmith/targetdb/testsupport/TargetDbImages.java、
  # perf/README.md（grafana/k6・eclipse-temurin の jre と jdk・grafana/otel-lgtm）、README.md（eclipse-temurin の jre と jdk）、
  # docker/hikari-pool.sh（JDK_IMAGE の eclipse-temurin の jdk）。
  # 知らせを受けてイメージを上げるときは、上の固定先も同じ版とダイジェストに手で揃える（grep でタグを探し、残りが無いことを確かめる）。
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # 見送る更新（Intent 260928-quality-followup の FR5.4、F2: C・Q1: A）。
    # 実行のイメージ（Dockerfile の eclipse-temurin）の JDK の大きな版は、ビルドと CI の JDK（gradle/libs.versions.toml の
    # java = "25"、.github/workflows/ci.yml の java-version）とそろえる。./gradlew verify はイメージを作らず確かめられないため、
    # 大きな版の更新だけを知らせない（25 の中の小さな更新は知らせる）。
    # 外す時期: JDK をビルド・CI とそろえて上げるとき。
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
  # compose.yaml のイメージ（手元でメールを見る受け手 Mailpit、手元の監視、見本の対象DB など。Intent 260925-user-management の U1）。
  # 見本の対象DB のイメージを上げるときは、結合テストのイメージの定数（TargetDbImages）と一緒に上げる。
  # どのイメージもダイジェストで固定している。上げるときは上の docker の項の「ダイジェストでのイメージの固定」の決まりに従い、
  # Dependabot が見ない固定先（docker/perf/compose.yaml・TargetDbImages・perf/README.md・README.md）も手で揃える。
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
