# 統合の後の再確認。ローカルの統合の前の関門と同じ ./gradlew verify を実行し、WAR を成果物として保存する。
# CI は秘密情報を使わない。使う Actions はコミットのハッシュで固定する（コメントは版の名前）。
name: CI

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.6.0
  OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

jobs:
  verify:
    name: ./gradlew verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリとサブモジュール（固定先のコミット）を取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # Gitleaks が履歴全体を調べるため、すべての履歴を取得する。
          fetch-depth: 0

      - name: JDK 25（Temurin）を入れる
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Node.js 24 を入れる
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            vendor/make-you-chic-ui/package-lock.json

      - name: Gradle を用意する（キャッシュを使う）
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Gitleaks と OSV-Scanner を入れる（版と SHA-256 を固定）
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          curl -sSfL -o "$HOME/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 1コマンドの検査を実行する
        run: ./gradlew verify

      - name: WAR を成果物として保存する（名前にコミットのハッシュを入れる）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mastersmith-${{ github.sha }}
          path: backend/build/libs/mastersmith.war
          retention-days: 30
          if-no-files-found: error

  release:
    name: リリースに WAR を添付する
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 検査を通った WAR を取得する
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mastersmith-${{ github.sha }}
      - name: GitHub のリリースを作り、WAR を添付する
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp mastersmith.war "mastersmith-${TAG}-${GITHUB_SHA}.war"
          gh release create "$TAG" "mastersmith-${TAG}-${GITHUB_SHA}.war" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "コミット ${GITHUB_SHA} の WAR"
