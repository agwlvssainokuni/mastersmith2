# 統合の後の再確認。ローカルの統合の前の関門と同じ ./gradlew verify を実行し、WAR を成果物として保存する。
# あわせて、規模・テストの件数・カバレッジを実行の要約（Summary）に書き、カバレッジの HTML の報告を保存する（docs/verification.md）。
# CI は秘密情報を使わない。使う Actions はコミットのハッシュで固定する（コメントは版の名前）。
name: CI

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b

jobs:
  verify:
    name: ./gradlew verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリとサブモジュール（固定先のコミット）を取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # Gitleaks が履歴全体を調べるため、すべての履歴を取得する。
          fetch-depth: 0

      - name: JDK 25（Temurin）を入れる
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Node.js 26 を入れる
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            vendor/make-you-chic-ui/package-lock.json

      - name: Gradle を用意する（キャッシュを使う）
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Gitleaks と OSV-Scanner を入れる（版と SHA-256 を固定）
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          curl -sSfL -o "$HOME/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 1コマンドの検査を実行する
        run: ./gradlew verify

      - name: WAR を成果物として保存する（名前にコミットのハッシュを入れる）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mastersmith-${{ github.sha }}
          path: backend/build/libs/mastersmith.war
          retention-days: 30
          if-no-files-found: error

      # ここから下の3つは報告だけの手順。./gradlew verify が落ちた回にも流し（if: always()）、成否で CI を失敗にしない。
      - name: 規模を数える道具（cloc）を入れる
        if: always()
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: 規模・テストの件数・カバレッジを実行の要約に書く
        if: always()
        continue-on-error: true
        env:
          # develop へのプッシュのときだけ、プッシュの前の先頭と比べる。手動の実行とタグのプッシュは空を渡す
          # （要約の規模の差の列が「—」になり、理由が1行出る）。
          SIZE_BASE: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.before || '' }}
        run: node scripts/ci-summary.mjs --base "$SIZE_BASE"

      - name: カバレッジの HTML の報告を成果物として保存する（名前にコミットのハッシュを入れる）
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html-${{ github.sha }}
          path: |
            backend/build/reports/jacoco/test/html/
            frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: リリースに WAR を添付する
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 検査を通った WAR を取得する
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mastersmith-${{ github.sha }}
      - name: GitHub のリリースを作り、WAR を添付する
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp mastersmith.war "mastersmith-${TAG}-${GITHUB_SHA}.war"
          gh release create "$TAG" "mastersmith-${TAG}-${GITHUB_SHA}.war" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "コミット ${GITHUB_SHA} の WAR"
