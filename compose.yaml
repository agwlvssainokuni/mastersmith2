# 開発者の PC で、アプリをコンテナで動かす。
#   起動: docker compose up -d --build （事前に ./gradlew :backend:bootWar で WAR を作る）
#   外部エクスポートの確認: .env で MASTERSMITH_OBSERVABILITY_EXPORT_ENABLED=true と
#     MASTERSMITH_OBSERVABILITY_EXPORT_ENDPOINT=http://otel-collector:4318 を設定し、
#     docker compose --profile observability up -d --build
# 秘密情報は Git 管理外の .env から渡す（見本は .env.example）。手元で試す対象DB の値だけは .env.targetdb（見本は .env.targetdb.example）。
name: mastersmith

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mastersmith:${MASTERSMITH_IMAGE_TAG:-local}
    ports:
      # 開発者の PC の localhost にだけ結び付ける。
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # タイムゾーンは Asia/Tokyo（Dockerfile の -Duser.timezone と合わせる。U2 の基盤の設計による U1 への追加）。
      TZ: Asia/Tokyo
    volumes:
      - mastersmith-data:/app/data
    healthcheck:
      # イメージに curl・wget が無いため、bash だけで /actuator/health を呼び、200 なら健全とする。
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 2s
    # アプリの穏やかな停止の待ち（30 秒）より長くする。
    stop_grace_period: 45s
    # CPU の上限は既定で 4（U2 の基盤の設計で U1 の「CPU 2」を上書き。照合の時間の目標は 4 が前提）。
    # メモリの上限は既定で 2g（1g では高い負荷でメモリの上限で止まりうるため。README の「コンテナの資源の上限」）。
    # colima の VM が CPU 4・メモリ 6GiB に満たない PC では、.env の MASTERSMITH_CONTAINER_MEMORY で 1g などに下げる。
    # Docker の VM の CPU が 4 に満たない PC では、.env の MASTERSMITH_CONTAINER_CPUS で下げる。
    # JVM の設定（ヒープの割合など）は .env の MASTERSMITH_JAVA_OPTIONS で変える（Dockerfile の ENTRYPOINT）。
    cpus: ${MASTERSMITH_CONTAINER_CPUS:-4}
    mem_limit: ${MASTERSMITH_CONTAINER_MEMORY:-2g}
    # 異常で止まったときは再起動しない（開発者が原因を見る）。
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector:0.161.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro

  # 手元の監視（Observability Setup で追加）。見たいときだけ profile monitoring で起動する。
  # 起動の前に .env で外部エクスポートを有効にし、送り先を http://lgtm:4318 にする（README の「手元の監視」）。
  # 受け手・指標（Prometheus）・ログ（Loki）・トレース（Tempo）・画面（Grafana）を1つにした、手元の確認向けのコンテナ。
  lgtm:
    image: grafana/otel-lgtm:0.33.1
    profiles: [monitoring]
    ports:
      # Grafana の画面だけを開発者の PC の localhost に結び付ける。OTLP の受け口は PC に開かない。
      - "127.0.0.1:3000:3000"
    environment:
      # 画面は見るだけ（ログインなしで閲覧、ログインの画面は出さない）。ダッシュボードと警報はファイルで入れる。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_LANGUAGE: ja-JP
    volumes:
      - mastersmith-monitoring:/data
      - ./docker/monitoring/provisioning/dashboards/mastersmith.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/mastersmith.yaml:ro
      - ./docker/monitoring/provisioning/alerting/mastersmith.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/mastersmith.yaml:ro
      - ./docker/monitoring/dashboards:/otel-lgtm/mastersmith-dashboards:ro
    # colima の VM（CPU 4・メモリ 6GiB）の中で、アプリ（上限 2GB）・見本の対象DB（512MB）と一緒に動かすための上限。
    # 900m では DSL の行を含むダッシュボードを開いたときに Grafana がメモリの上限で止められた（2026-09-25）ため 1536m にした。
    # 負荷の試験の環境（上限 2GB）と同時に動かすと VM の上限に近づくため、負荷の試験の間は止める（README の「手元の監視」）。
    mem_limit: 1536m
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # 手元で試す対象DB（U1）。画面からスキーマの読み込みを試すときや、Build and Test で時間を測るときに、1つずつ profile で起動する。
  #   起動: docker compose --profile targetdb-postgres up -d targetdb-postgres （mysql・mariadb も同じ形）
  # ポートは PC に開けない。アプリのコンテナから compose の中の名前（例 targetdb-postgres:5432）で接続する。
  # 版は結合テストのイメージ（backend/src/test/java/cherry/mastersmith/targetdb/testsupport/TargetDbImages.java）と同じ値にする。
  # 管理者と読み取りのアカウントのパスワードは .env.targetdb から渡す（MASTERSMITH_SAMPLE_TARGETDB_*。見本は .env.targetdb.example。
  # 空なら DB の起動が失敗する）。アプリのコンテナに見本の DB の管理者のパスワードを渡さないよう、.env とは分ける。
  # compose の ${...} の展開は .env だけを読むため、起動の入口（entrypoint）を sh で包み、管理者のパスワードを各イメージの変数に
  # 写してから、イメージ本来の入口（docker-entrypoint.sh）を呼ぶ（$$ は compose に展開させないための書き方）。
  # entrypoint を上書きするとイメージの CMD も消えるため、command に本来の値を書く。イメージの版を上げるときは、
  # docker image inspect で本来の Entrypoint と Cmd を確かめて合わせる。
  # 見本のスキーマと読み取りだけのアカウントは、初めて起動したときに docker/targetdb/<種類>/ の SQL と台本で作る。
  targetdb-postgres:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    profiles: [targetdb-postgres]
    env_file:
      - path: .env.targetdb
        required: false
    environment:
      POSTGRES_DB: business
      POSTGRES_USER: target_admin
    entrypoint:
      - sh
      - -c
      - export POSTGRES_PASSWORD="$${MASTERSMITH_SAMPLE_TARGETDB_ADMIN_PASSWORD:-}"; exec docker-entrypoint.sh "$$@"
      - docker-entrypoint.sh
    command: [postgres]
    volumes:
      - mastersmith-targetdb-postgres:/var/lib/postgresql
      - ./docker/targetdb/postgres:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    restart: "no"

  targetdb-mysql:
    image: mysql:8.4.11@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    profiles: [targetdb-mysql]
    env_file:
      - path: .env.targetdb
        required: false
    environment:
      MYSQL_DATABASE: business
    entrypoint:
      - sh
      - -c
      - export MYSQL_ROOT_PASSWORD="$${MASTERSMITH_SAMPLE_TARGETDB_ADMIN_PASSWORD:-}"; exec docker-entrypoint.sh "$$@"
      - docker-entrypoint.sh
    command: [mysqld]
    volumes:
      - mastersmith-targetdb-mysql:/var/lib/mysql
      - ./docker/targetdb/mysql:/docker-entrypoint-initdb.d:ro
    mem_limit: 768m
    restart: "no"

  targetdb-mariadb:
    image: mariadb:11.8.9@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    profiles: [targetdb-mariadb]
    env_file:
      - path: .env.targetdb
        required: false
    environment:
      MARIADB_DATABASE: business
    entrypoint:
      - sh
      - -c
      - export MARIADB_ROOT_PASSWORD="$${MASTERSMITH_SAMPLE_TARGETDB_ADMIN_PASSWORD:-}"; exec docker-entrypoint.sh "$$@"
      - docker-entrypoint.sh
    command: [mariadbd]
    volumes:
      - mastersmith-targetdb-mariadb:/var/lib/mysql
      - ./docker/targetdb/mariadb:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    restart: "no"

volumes:
  mastersmith-data:
  mastersmith-monitoring:
  mastersmith-targetdb-postgres:
  mastersmith-targetdb-mysql:
  mastersmith-targetdb-mariadb:
